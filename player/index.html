<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Server Player</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="layout">
      <aside class="sidebar">
        <div class="sidebar-head-mobile">
          <button id="closeNavBtn" type="button" class="mini-btn icon-btn" title="关闭导航">✕</button>
        </div>
        <h1>Music Player</h1>
        <section>
          <h2>内置列表</h2>
          <ul id="builtinList" class="group-list"></ul>
        </section>
        <section class="category-panel">
          <div class="category-head">
            <h2>分类浏览</h2>
            <div class="view-toggle" id="viewToggle">
              <button type="button" data-view="album" class="mini-btn active">专辑</button>
              <button type="button" data-view="artist" class="mini-btn">艺术家</button>
            </div>
          </div>
          <input id="categoryFilter" class="filter-input" type="search" placeholder="搜索专辑或艺术家" />
          <ul id="categoryList" class="group-list scroll-list"></ul>
        </section>
      </aside>
      <section class="browser-panel">
        <div class="browser-head">
          <button id="openNavBtn" type="button" class="mini-btn icon-btn nav-toggle-btn" title="展开导航">☰</button>
          <h2 id="browseTitle">列表内容</h2>
          <div class="browser-controls">
            <input id="trackSearchInput" class="track-search-input" type="search" placeholder="搜索当前列表" />
            <button id="searchPrevBtn" type="button" class="mini-btn icon-btn" title="上一个">&#x21E6;</button>
            <button id="searchNextBtn" type="button" class="mini-btn icon-btn" title="下一个">&#x21E8;</button>
            <span id="searchCount" class="search-count">0/0</span>
            <button id="playAllBtn" type="button" class="icon-btn icon-play" title="播放全部">&#x25B6;</button>
          </div>
        </div>
        <div class="track-table-wrap">
          <table class="track-table">
            <thead>
              <tr>
                <th>
                  <button type="button" class="th-sort" data-sort="title">标题</button>
                </th>
                <th>
                  <button type="button" class="th-sort" data-sort="artist">艺术家</button>
                </th>
                <th>
                  <button type="button" class="th-sort" data-sort="album">专辑</button>
                </th>
                <th>
                  <button type="button" class="th-sort" data-sort="duration">时长</button>
                </th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="trackTbody"></tbody>
          </table>
        </div>
      </section>
      <section class="content player-panel">
        <div id="aplayer"></div>
        <div class="toolbar">
          <button id="toggleFavorite" type="button" class="icon-btn">&#x2605;</button>
        </div>
      </section>
    </main>
    <div id="navOverlay" class="nav-overlay" aria-hidden="true"></div>

    <script>
      window.MUSIC_JSON_URL = window.MUSIC_JSON_URL || "/data/music.json";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/aplayer@1.10.1/dist/APlayer.min.js"></script>
    <script src="./storage.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
